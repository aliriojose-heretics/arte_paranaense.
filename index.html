      <section id="raizes">
         <h2>Raízes históricas e o simbolismo da bebida no Paraná</h2>
         <p>O chimarrão é muito mais do que uma infusão de erva-mate (Ilex paraguariensis) e água quente; é um
            símbolo de identidade e hospitalidade no Paraná. Herdado dos povos indígenas e incorporado à rotina dos
            tropeiros, o hábito de tomar mate carrega o significado de pausa, respeito à terra e preservação da
            memória do Sul do Brasil. Cada elemento do preparo — da cuia à bomba — conecta o presente às tradições
            dos antepassados paranaenses.</p>

      <section id="tradicao">
         <h2>Como a tradição aproxima gerações e fortalece laços</h2>
         <p>Um dos aspectos mais marcantes do chimarrão é o seu caráter coletivo. A "roda de chimarrão" é um espaço
            democrático de conversa, onde o mate passa de mão em mão, simbolizando amizade e igualdade. Nas famílias
            e comunidades paranaenses, preparar o chimarrão pela manhã ou ao final da tarde é o momento em que as
            histórias são compartilhadas, aproximando diferentes gerações e mantendo os costumes vivos no cotidiano.
         </p>

      <section id="consumo">
         <h2>As nuances do consumo de erva-mate no estado</h2>
         <p>Embora o chimarrão tradicional — servido quente — seja o clássico do cotidiano paranaense, a cultura do mate
            adapta-se às diferentes regiões e estações. No norte e noroeste do estado, por exemplo, o tereré (preparado
            com água gelada) ganha força nos dias de calor. Ambas as bebidas compartilham a mesma matéria-prima, mas
            refletem a diversidade de costumes e o dinamismo cultural do Paraná.
         </p>

      <section id="curiosidades">
         <h2>Curiosidades</h2>
         <div class="card">
            <h3>A Cidade Capital da Erva-Mate</h3>
            <p>O Paraná é o maior produtor de erva-mate do Brasil, e o município de Cruz Machado carrega o título de
               Capital Nacional da Erva-Mate. A produção no estado destaca-se pelo cultivo sombreado, feito em meio à
               Mata de Araucárias, o que preserva a floresta nativa e confere um sabor suave e característico ao
               chimarrão paranaense.</p>
         </div>
         <div class="card">
            <h3>As Regras de Ouro da Roda de Mate</h3>
            <p>A roda de chimarrão possui uma "etiqueta" informal transmitida entre gerações. Entre as principais
               costumes, destaca-se: quem prepara a cuia toma o primeiro mate (para testar a temperatura e o fluxo da
               bomba), o mate deve ser tomado até a cuia "chiar", e dizer "obrigado" ao devolver a cuia significa que
               você já está satisfeito e não deseja as próximas rodadas.</p>
         </div>
